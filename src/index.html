<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self'; script-src 'self'; connect-src 'self';" />
    <meta name="color-scheme" content="light" />
    <title>小鱼 · 桌面伙伴</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./character-texture.js" defer></script>
    <script src="./rig.js" defer></script>
    <script src="./pet.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="pet" id="pet">
        <div class="speech-bubble" id="speech-bubble" aria-live="polite">嗨，我来陪你啦！</div>
        <div class="pet-figure" id="pet-figure">
          <button class="character-button" id="character-button" type="button" aria-label="和桌宠互动">
            <canvas class="character" id="character" width="471" height="640" role="img" aria-label="绘梨衣 Q版形象"></canvas>
          </button>
        </div>
        <div class="pet-name" id="pet-name">小鱼 <span class="status-dot"></span></div>
        <div class="quick-actions" id="quick-actions">
          <button class="action-button" id="wave-button" type="button">挥挥手</button>
          <button class="close-button" id="close-button" type="button" aria-label="收起到托盘" title="收起到托盘">×</button>
        </div>
      </div>
    </main>
  </body>
</html>
