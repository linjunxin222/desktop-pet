<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
    <title>桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="drag-strip" aria-hidden="true"></div>
      <button class="close-button" id="close-button" type="button" aria-label="关闭桌宠">×</button>

      <section class="pet-screen" id="pet-screen" aria-label="桌面宠物">
        <div class="speech-bubble" id="speech-bubble" aria-live="polite">嗨，我来陪你啦！</div>
        <button class="character-button" id="character-button" type="button" aria-label="和桌宠互动">
          <svg class="character" id="character" viewBox="0 0 240 300" role="img" aria-label="Q版女孩桌宠">
            <defs>
              <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50405f"/><stop offset="1" stop-color="#302c49"/></linearGradient>
              <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98ce4"/><stop offset="1" stop-color="#8064c8"/></linearGradient>
              <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3d8"/><stop offset="1" stop-color="#f8c8bd"/></linearGradient>
            </defs>
            <ellipse cx="120" cy="278" rx="64" ry="12" fill="#564b6d" opacity=".13"/>
            <path d="M70 222c-3 18-9 30-8 48 0 7 8 11 22 11h22c8-4 10-12 7-23l-5-36zm57 0-4 35c-2 11 1 20 9 24h22c14 0 22-4 22-11-1-18-6-30-9-48z" fill="#f6d5ca"/>
            <path d="M73 154c10-16 28-24 47-24s37 8 47 24l16 64c-13 22-39 34-63 34s-50-12-63-34z" fill="url(#dress)"/>
            <path d="M95 154c5 13 14 21 25 21s20-8 25-21l-25-10z" fill="#f6eaf3"/>
            <path d="M83 80c0-39 19-62 46-62 31 0 51 27 47 70l-7 66H74z" fill="url(#hair)"/>
            <path d="M92 91c0-34 12-51 31-51 24 0 37 20 37 53v30c0 31-15 53-39 53s-39-22-39-53z" fill="url(#skin)"/>
            <path d="M79 96c-4-42 13-72 49-75 32-2 51 23 51 54-12-8-19-22-21-34-14 21-41 35-77 39l-2 37-9-1z" fill="url(#hair)"/>
            <path d="M80 95c-16-5-19 7-14 20 3 8 9 12 16 11m83-31c16-5 19 7 14 20-3 8-9 12-16 11" fill="#f8d0c4"/>
            <path d="M99 117c5-6 12-6 17 0m14 0c5-6 12-6 17 0" fill="none" stroke="#49364e" stroke-width="5" stroke-linecap="round"/>
            <circle cx="106" cy="118" r="2.4" fill="#fff"/><circle cx="147" cy="118" r="2.4" fill="#fff"/>
            <path d="M113 140c5 5 12 5 17 0" fill="none" stroke="#d47f88" stroke-width="3" stroke-linecap="round"/>
            <ellipse cx="91" cy="137" rx="10" ry="5" fill="#ee9b9e" opacity=".55"/><ellipse cx="161" cy="137" rx="10" ry="5" fill="#ee9b9e" opacity=".55"/>
            <circle cx="181" cy="89" r="9" fill="#f5d28a"/><circle cx="184" cy="89" r="4" fill="#fff2c9"/>
          </svg>
        </button>
        <div class="pet-name">小鱼 <span class="status-dot"></span></div>
        <p class="pet-hint">点点我，或者右键看看我的小屋</p>
        <div class="quick-actions">
          <button class="action-button" id="wave-button" type="button">挥挥手</button>
          <button class="action-button action-button--soft" id="house-button" type="button">去小屋</button>
        </div>
      </section>

      <section class="house-screen" id="house-screen" aria-label="桌宠的小屋" hidden>
        <header class="house-header">
          <button class="back-button" id="back-button" type="button" aria-label="返回桌面">←</button>
          <div><span class="eyebrow">她的小世界</span><h1>温暖小屋</h1></div>
        </header>
        <div class="room">
          <div class="window-view"><span>☁️</span><span>☀️</span></div>
          <div class="shelf"><span>📚</span><span>🌱</span><span>🧸</span></div>
          <div class="desk"><div class="lamp">✦</div><div class="book-stack"></div><div class="mug">☕</div></div>
          <div class="room-character" aria-hidden="true">૮ ˶ᵔ ᵕ ᵔ˶ ა</div>
          <div class="room-caption"><span class="room-status"><i></i> 正在房间里休息</span><p>“这里是我们的小小空间。”</p></div>
        </div>
        <button class="return-button" id="return-button" type="button">回到桌面</button>
      </section>
    </main>
  </body>
</html>
