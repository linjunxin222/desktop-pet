<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
    <title>桌宠</title>
    <link rel="stylesheet" href="../assets/idle-layout.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <section class="pet-screen" id="pet-screen" aria-label="桌面宠物">
        <div class="character-handle" aria-label="绘梨衣，按住左键拖动，右键打开菜单">
          <span class="character-stage" id="character-stage">
            <video class="character" id="character" src="../assets/idle.webm" poster="../assets/idle-poster.png" aria-label="绘梨衣待机动画" autoplay loop muted playsinline preload="auto" disablepictureinpicture draggable="false"></video>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
