<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
    <title>桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="drag-strip" aria-hidden="true"></div>
      <button class="close-button" id="close-button" type="button" aria-label="关闭桌宠">×</button>

      <section class="pet-screen" id="pet-screen" aria-label="桌面宠物">
        <div class="speech-bubble" id="speech-bubble" aria-live="polite">嗨，我来陪你啦！</div>
        <button class="character-button" id="character-button" type="button" aria-label="和红发女孩桌宠互动">
          <svg class="character" id="character" viewBox="0 0 240 300" role="img" aria-label="红发白红服装的Q版女孩和小黄鸭">
            <defs>
              <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9b58"/><stop offset=".48" stop-color="#e74f32"/><stop offset="1" stop-color="#a93236"/></linearGradient>
              <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#e9e5eb"/></linearGradient>
              <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b42"/><stop offset="1" stop-color="#bd2e37"/></linearGradient>
              <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0df"/><stop offset="1" stop-color="#f4c6b5"/></linearGradient>
            </defs>
            <ellipse cx="120" cy="283" rx="65" ry="10" fill="#8d5751" opacity=".12"/>
            <path d="M97 215h18l-5 47c-1 8-7 13-15 12l-5-3 6-56zm31 0h18l9 54-5 4c-8 1-14-4-15-12z" fill="url(#skin)"/>
            <path d="M83 261c8-3 18-2 23 3l-3 18H78c-4-2-4-7 0-12zm48 3c7-5 17-6 24-2l11 10c3 4 1 9-4 10h-32z" fill="#fffaf3"/>
            <path d="M78 57c-12 20-10 76-4 119 4 27-2 56-21 77 24-3 43-21 51-49l-2-126zm82 0c12 20 10 76 4 119-4 27 2 56 21 77-24-3-43-21-51-49l2-126z" fill="url(#hair)"/>
            <path d="M89 135c-20 4-33 18-47 35l-21 24 16 15 25-19 25-1zm62 0c20 4 33 18 47 35l21 24-16 15-25-19-25-1z" fill="url(#robe)" stroke="#d8d1d5" stroke-width="2"/>
            <path d="M21 194l17 16 8-9-14-16zm198 0-17 16-8-9 14-16z" fill="url(#red)"/>
            <path d="M84 134c8-11 21-17 36-17s28 6 36 17l16 83c-14 15-32 23-52 23s-38-8-52-23z" fill="url(#robe)" stroke="#d4ccd2" stroke-width="2"/>
            <path d="M86 142c12 7 22 11 34 11s22-4 34-11l-10 55c-6 8-15 13-24 13s-18-5-24-13z" fill="url(#red)"/>
            <path d="M100 132h40l-5 17-15 10-15-10z" fill="#322d37"/>
            <path d="M111 154h18l8 57-17 17-17-17z" fill="#fffaf4" stroke="#d6cdd2" stroke-width="1.5"/>
            <path d="M119 158h5v65h-5z" fill="#e84c36"/>
            <path d="M87 151l16 10-8 21-14-13zm66 0-16 10 8 21 14-13z" fill="#292b33"/>
            <path d="M83 73c0-37 16-58 39-58s39 21 39 58v27c0 35-16 56-39 56s-39-21-39-56z" fill="url(#skin)"/>
            <path d="M73 91c-6-37 4-72 33-82 25-9 52 1 62 25 6 14 5 31 2 48-8-5-14-16-16-28-14 13-37 20-68 20l-4 31-9-1z" fill="url(#hair)"/>
            <path d="M85 86c-10-8-17-3-16 8 1 8 6 13 14 14m79-22c10-8 17-3 16 8-1 8-6 13-14 14" fill="#f4ccbc"/>
            <path d="M94 99c5-5 11-5 16 0m19 0c5-5 11-5 16 0" fill="none" stroke="#69353a" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="102" cy="101" rx="3" ry="5" fill="#8c453c"/><ellipse cx="137" cy="101" rx="3" ry="5" fill="#8c453c"/>
            <circle cx="103" cy="99" r="1.4" fill="#fff"/><circle cx="138" cy="99" r="1.4" fill="#fff"/>
            <path d="M113 119c4 3 9 3 13 0" fill="none" stroke="#d8817c" stroke-width="2.5" stroke-linecap="round"/>
            <ellipse cx="88" cy="114" rx="8" ry="4" fill="#ec8f89" opacity=".55"/><ellipse cx="151" cy="114" rx="8" ry="4" fill="#ec8f89" opacity=".55"/>
            <path d="M96 43c-6 23-7 39-6 57m22-70c-1 18-3 33-10 45m30-48c0 21 7 34 19 46m-2-31c4 18 11 30 22 38" fill="none" stroke="#ffb16c" stroke-width="3" stroke-linecap="round" opacity=".82"/>
            <path d="M165 52c14-9 19 1 12 13l-14 14-7-7z" fill="#fff8ef" stroke="#dfd4d7" stroke-width="2"/>
            <path d="M167 57l13-7-6 17z" fill="#e75a3e"/>
            <path d="M176 15c0-9 7-14 15-11 5 2 8 8 8 14 8-3 15 1 15 8 0 9-10 13-22 12-14-1-24-7-24-14 0-4 3-7 8-9z" fill="#ffd95e" stroke="#dbad39" stroke-width="2"/>
            <ellipse cx="190" cy="26" rx="12" ry="6" fill="#f6bd39" opacity=".5"/>
            <circle cx="194" cy="13" r="1.8" fill="#443b38"/>
            <path d="M212 19l11 4-12 4z" fill="#f09a42"/>
            <path d="M71 213c8 7 15 10 23 12m76-12c-8 7-15 10-23 12" fill="none" stroke="#e74d38" stroke-width="4" stroke-linecap="round"/>
            <path d="M81 230l-6 12m84-12 6 12" stroke="#33313a" stroke-width="4" stroke-linecap="round"/>
        </button>
        <div class="pet-name">小鱼 <span class="status-dot"></span></div>
        <p class="pet-hint">点点我，或者右键看看我的小屋</p>
        <div class="quick-actions">
          <button class="action-button" id="wave-button" type="button">挥挥手</button>
          <button class="action-button action-button--soft" id="house-button" type="button">去小屋</button>
        </div>
      </section>

      <section class="house-screen" id="house-screen" aria-label="桌宠的小屋" hidden>
        <header class="house-header">
          <button class="back-button" id="back-button" type="button" aria-label="返回桌面">←</button>
          <div><span class="eyebrow">她的小世界</span><h1>温暖小屋</h1></div>
        </header>
        <div class="room">
          <div class="window-view"><span>☁️</span><span>☀️</span></div>
          <div class="shelf"><span>📚</span><span>🌱</span><span>🧸</span></div>
          <div class="desk"><div class="lamp">✦</div><div class="book-stack"></div><div class="mug">☕</div></div>
          <div class="room-character" aria-hidden="true">૮ ˶ᵔ ᵕ ᵔ˶ ა</div>
          <div class="room-caption"><span class="room-status"><i></i> 正在房间里休息</span><p>“这里是我们的小小空间。”</p></div>
        </div>
        <button class="return-button" id="return-button" type="button">回到桌面</button>
      </section>
    </main>
  </body>
</html>
